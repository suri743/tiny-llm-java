name: Train LLM on EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # ============================
      # CHECKOUT
      # ============================
      - uses: actions/checkout@v4

      # ============================
      # CONFIGURE AWS CREDENTIALS
      # ============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================
      # BUILD FAT JAR
      # ============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build fat JAR
        run: mvn -B clean package -DskipTests

      # ============================
      # BOOTSTRAP S3 STATE BUCKET (first run only)
      # ============================
      - name: Bootstrap Terraform state bucket
        run: |
          aws s3api create-bucket \
            --bucket instyte-llm-training-state \
            --region ap-south-1 \
            --create-bucket-configuration LocationConstraint=ap-south-1 \
            2>/dev/null || echo "Bucket already exists"

          aws dynamodb create-table \
            --table-name instyte-llm-training-lock \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ap-south-1 \
            2>/dev/null || echo "Table already exists"

      # ============================
      # TERRAFORM — SPIN UP EC2 + UPLOAD JAR
      # ============================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Destroy existing instance
        working-directory: infra
        run: terraform destroy -target=aws_instance.training -auto-approve || true

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      # ============================
      # UPLOAD JAR TO S3
      # ============================
      - name: Upload JAR to S3
        run: |
          aws s3 cp target/tiny-llm.jar s3://instyte-llm-training/tiny-llm.jar

      - name: Print instance info
        working-directory: infra
        run: |
          echo "Instance ID: $(terraform output -raw instance_id)"
          echo "Public IP:   $(terraform output -raw instance_public_ip)"
          echo ""
          echo "Monitor training:"
          echo "  ssh ec2-user@$(terraform output -raw instance_public_ip) 'tail -f /opt/llm-training/training.log'"
